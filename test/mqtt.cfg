connection_messages true
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type all

listener 8884
cafile ./test/ca/rootCA.pem
certfile ./test/server/server.crt
keyfile ./test/server/server.key
require_certificate true

listener 1883
auth_plugin ./test/auth.so
auth_plugin_deny_special_chars false
auth_opt_hello world
